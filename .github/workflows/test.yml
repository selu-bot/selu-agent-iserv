name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run lint
        run: ruff check .
      - name: Build capability image
        run: docker build --tag selu-cap-iserv:ci capabilities/iserv/container
