id: iserv
class: tool
image: selu-cap-iserv:latest

tools:
  - name: check_parent_letters
    description: >-
      Fetches the list of parent letters (Elternbriefe) from IServ.
      Returns title, date, child, sender, read status, and href for each letter.
      Confirmation requirements are determined only after opening a letter.
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of letters to return (default 20)
        offset:
          type: integer
          description: Number of letters to skip for pagination (default 0)
        unread_only:
          type: boolean
          description: If true, return only unread letters (default false)
      required: []
    recommended_policy: allow

  - name: get_parent_letter
    description: >-
      Retrieves the full content of a specific parent letter by its href.
      Returns sanitized letter text, attachment metadata, and whether a read confirmation is required.
    input_schema:
      type: object
      properties:
        href:
          type: string
          description: The relative URL path of the parent letter (from check_parent_letters results)
      required:
        - href
    recommended_policy: allow

  - name: confirm_parent_letter
    description: >-
      Sends a read confirmation for a parent letter that requires acknowledgement.
      This action is irreversible.
    input_schema:
      type: object
      properties:
        href:
          type: string
          description: The relative URL path of the parent letter to confirm
      required:
        - href
    recommended_policy: ask

  - name: download_attachment
    description: >-
      Downloads a file attachment from a parent letter.
      The file is made available as an output artifact for the user to download.
    input_schema:
      type: object
      properties:
        attachment_href:
          type: string
          description: The relative URL path of the attachment to download
      required:
        - attachment_href
    recommended_policy: allow

  - name: check_notifications
    description: >-
      Fetches recent notifications from IServ.
      Returns id, title, message, date, type (when provided), and read status for each notification.
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of notifications to return (default 20)
      required: []
    recommended_policy: allow

  - name: parse_pdf_attachment
    description: >-
      Downloads a PDF attachment from a parent letter and extracts its text page by page.
      Returns the filename, page count, page text, combined text, and truncation status.
      The parser is bundled with the capability and needs no optional agent skill.
    input_schema:
      type: object
      properties:
        attachment_href:
          type: string
          description: The relative URL path of the PDF attachment from get_parent_letter
      required:
        - attachment_href
    recommended_policy: allow

network:
  mode: allowlist
  hosts:
    - "mags-greven.de:443"

filesystem: temp

credentials:
  - name: ISERV_BASE_URL
    scope: system
    required: false
    description: "IServ base URL for your school (default: https://mags-greven.de)"
  - name: USERNAME
    scope: user
    required: true
    description: IServ username or email address
  - name: PASSWORD
    scope: user
    required: true
    description: IServ account password

resources:
  max_memory_mb: 256
  max_cpu_fraction: 0.5
  max_cpu_seconds: 30
  pids_limit: 64
